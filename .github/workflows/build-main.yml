name: Build, Push & Deploy (main)

# Single-environment flow: every merge to main builds one Docker image, pushes
# it to GHCR, and triggers the one Coolify deployment. For a versioned
# release, use the separate manual "Promote to Release Tag" workflow to
# retag a specific :sha-<short> image once you're happy with it.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/benblustey/client-progress-dashboard

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tags
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "app_version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          install: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: Dockerfile
          target: runner
          push: true
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.app_version }}
            GIT_SHA=${{ steps.vars.outputs.short_sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:${{ steps.vars.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.app_version }}
          cache-from: type=gha,scope=client-progress-dashboard
          cache-to: type=gha,mode=max,scope=client-progress-dashboard

      - name: Trigger Coolify deployment
        run: |
          curl --silent --show-error --fail \
            -X GET "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"
